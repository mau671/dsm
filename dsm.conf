# ==============================================================================
# ARCHIVO DE CONFIGURACION GENERAL: dsm.conf
# Sistema de Memoria Compartida Distribuida con Coherencia MSI
# ==============================================================================

# --- Identidad y estructura ---
CLUSTER_ID          = 0x534F3031
PAGE_SIZE           = 4096
BASE_ADDR           = 0x200000000000
BASE_ADDR_TSAN      = 0x4000000000       # Utilizado solo al compilar con TSan (-DDSM_TSAN)
VIEW_SIZE           = 4294967296         # 4 GiB
MAX_RUNTIME_NODES   = 256
VNODES_PER_MB       = 16                 # Vnodes del anillo por MiB aportado
REDUNDANCY          = false              # true exige al menos 3 nodos vivos; K = nodos vivos - 1
CHUNK_PAGES         = 4                  # Páginas por grupo de orden y franja en los informes HTML
WAIT_POOL_ENTRIES   = 64                 # Capacidad de particiones de ejecución distribuida por trabajo (tope 4096)
DIST_TIMEOUT_MS     = 5000               # Plazo para ejecución distribuida en milisegundos
OUTPUT_DIR          = reports            # Directorio de reportes HTML por nodo y global

# --- Memoria local de esta PC (puede variar entre nodos del mismo clúster) ---
NODE_MEM            = 268435456          # 256 MiB; cada PC puede declarar otra cantidad

# --- Red y descubrimiento ---
# PORT_MIN/PORT_MAX fijan los puertos TCP de escucha del grupo (27600 - 27699).
# Cada nodo anuncia su nombre, IP, puerto TCP y rol por UDP en el grupo
# multicast DISCOVERY_GROUP:DISCOVERY_PORT, con broadcast como respaldo.
PORT_MIN            = 27600
PORT_MAX            = 27699
DISCOVERY_GROUP     = 239.255.42.99
DISCOVERY_PORT      = 27699

# --- Temporizaciones de transporte y sondeo (en milisegundos) ---
CONNECT_TIMEOUT_MS  = 200
DISCOVERY_TIMEOUT_MS= 300
SEND_TIMEOUT_MS     = 2000
REQUEST_TIMEOUT_MS  = 3000
REQUEST_RETRIES     = 3
RECONNECT_MIN_MS    = 100
RECONNECT_MAX_MS    = 2000

# --- Deteccion de caidas y vivacidad (Heartbeat) ---
HB_INTERVAL_MS      = 500
HB_SUSPECT          = 3                  # 3 fallos consecutivos -> SUSPECT
HB_DEAD             = 6                  # 6 fallos consecutivos -> DEAD (~3 seg)

# --- Grupos de hilos y limites ---
WORKER_THREADS      = 4
DISPATCHER_THREADS  = 2
PAGE_LOCK_STRIPES   = 256
HOME_SLACK          = 1.25               # +25% de margen sobre el aporte nominal
LOCK_TIMEOUT_MS     = 10000
WORKER_QUEUE_CAP    = 4096              # Capacidad de la cola de mensajes de red pendientes de despacho

# --- Diagnostico ---
DSM_LOG_LEVEL       = INFO              # Nivel de registro: ERROR, WARN, INFO, DEBUG o TRACE
